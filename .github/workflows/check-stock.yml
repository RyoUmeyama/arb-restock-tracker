name: Check Gunpla Restock

on:
  schedule:
    # 【2026-07-03 クラウド主戦化】ローカルMacは平日日中しか起動しないため、Actionsを主戦に戻す。
    #  - nyuka-nowはクラウドIPを遮断 → 主要銘柄はanime-matsuriの同種まとめページに移行済み。
    #    nyuka-now系はローカル実行時のみ機能するボーナス層。
    #  - リポジトリはpublicのためActions分数は無料・無制限（旧private時代の月2,000分制約は解消済み）。
    #
    # 【2026-08-19 cron整理】毎時4回(:07/:22/:37/:52)から毎時1回に変更。
    #  理由: 1起動が LOOP_COUNT=8 × LOOP_INTERVAL=420秒 ＝ 実測約68〜75分かかるため、
    #  15分間隔で起動しても後発は concurrency 待ちで捨てられていた（直近50件中23件がcancelled）。
    #  実測でも GitHub 側のスケジュール間引きにより実際の起動間隔は平均62分で、
    #  毎時1回の指定と実効カバレッジはほぼ変わらない。
    #  1起動が約68分カバーするので毎時起動でパスが途切れず繋がる
    #  （実測: 約8.5分ごとにパスが連続、監視の空白なし）。
    #  ポーリングを密にしたい場合は cron ではなく LOOP_INTERVAL を下げること
    #  （ただし37サイトへのアクセス頻度が上がるため負荷・ブロックとのトレードオフ）。
    #
    #  毎時2回にしている理由: 1起動68分に対し毎時1回だと余裕がわずか8分しかなく、
    #  実測の起動遅延（中央値5分・最大7分）で空白が出かねない。
    #  :07 と :37 の2本にすれば、片方が間引かれても もう片方が拾う（保険）。
    #  30分間隔なら concurrency で捨てられるのは1本までで、cancelled は大幅に減る。
    - cron: '7,37 * * * *'
  workflow_dispatch: # 手動実行も可
    inputs:
      test_notify:
        description: '1にするとテスト通知を1本送って通知経路(Secrets)を確認'
        required: false
        default: '0'

concurrency:
  group: gunpla-restock
  cancel-in-progress: false

permissions:
  contents: write  # 検知した抽選候補（data/detected_lotteries.json）のコミット用

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # ジョブ内ループ(約60分)＋余裕。暴走時の保護
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore stock state
        uses: actions/cache/restore@v4
        with:
          path: stock_state.json
          # page_update のハッシュ計算を変えたらこのキーのバージョンを上げる(v4→v5...)。
          # 旧ハッシュのcacheを引き継がないことで、新フィルタの基準から開始し誤発火を防ぐ。
          key: gunpla-stock-state-v4-${{ github.run_id }}
          restore-keys: |
            gunpla-stock-state-v4-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock checker
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          # 手動実行時に test_notify=1 を渡すと通知経路テストモードになる
          TEST_NOTIFY: ${{ github.event.inputs.test_notify }}
          # 【2026-07-06 カバレッジ拡大】cronは15分指定でも実測60〜90分間隔（深夜は最大4.5時間）
          # に間引かれると週末の実測で判明。1起動を約60分粘る設計にして間引きの隙間を埋める:
          # 8パス×7分間隔≈1時間。concurrencyグループで同時実行は防がれ、待機中のcronが
          # 前ジョブ終了直後に連結して起動する＝ほぼ連続カバー。
          # 監視先への負荷は1ページあたり7〜8分に1回（一般的な在庫監視サービスと同等）。
          LOOP_COUNT: '8'
          LOOP_INTERVAL: '420'
          # ログをリアルタイムに出す（バッファリングで実行途中の進捗が見えない問題の解消）
          PYTHONUNBUFFERED: '1'
        run: python check_stock.py

      - name: Commit detected lotteries（応募台帳への連携データ）
        if: always()
        run: |
          if [ -f data/detected_lotteries.json ] && ! git diff --quiet -- data/detected_lotteries.json 2>/dev/null || [ -n "$(git status --porcelain data/ 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/detected_lotteries.json
            git commit -m "抽選候補データ更新 [skip ci]" || exit 0
            git pull --rebase origin main || true
            git push || echo "push失敗（次回実行で再試行される）"
          fi

      - name: Save stock state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: stock_state.json
          key: gunpla-stock-state-v4-${{ github.run_id }}
